# Base configuration shared by every profile.
# Integration-specific settings live in profiles/<name>/smart.conf.

CONFIG_BOOT_BANNER=n
CONFIG_UART_CONSOLE=n

# UART: interrupt-driven RX, baud set at runtime from the profile
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_RING_BUFFER=y

CONFIG_GPIO=y
CONFIG_WATCHDOG=y

# Hierarchical state machines
CONFIG_SMF=y
CONFIG_SMF_ANCESTOR_SUPPORT=y
CONFIG_SMF_INITIAL_TRANSITION=y

# Debug output over SEGGER RTT (SWD header J8); never touches the UARTs
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=64

CONFIG_MAIN_STACK_SIZE=4096
