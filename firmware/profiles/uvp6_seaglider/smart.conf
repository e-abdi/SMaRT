# UVP6 on a Seaglider through logdev, after the Smart-Cable sg644 setup.
# The glider side is uvp6.cnf in this folder.

CONFIG_SMART_GLIDER_SEAGLIDER=y
CONFIG_SMART_GLIDER_BAUD=115200
CONFIG_SMART_SENSOR_BAUD=38400

# ---- logdev command set (must match uvp6.cnf) ----
CONFIG_SMART_LOGDEV_PROMPT="UV>"
CONFIG_SMART_LOGDEV_CMD_START="START"
CONFIG_SMART_LOGDEV_CMD_STOP="STOP"
CONFIG_SMART_LOGDEV_CMD_DEPTH="DEPTH:"
CONFIG_SMART_LOGDEV_CMD_DOWNLOAD="SEND_TXT_FILE"

# ---- UVP6 ----
CONFIG_SMART_SENSOR_NAME="UVP6"
CONFIG_SMART_SENSOR_READY_TOKEN="HW_CONF"
CONFIG_SMART_SENSOR_BOOT_TIMEOUT_MS=5000
CONFIG_SMART_SENSOR_START_CMD="$start:ACQ_CSCS_022H,%Y%m%d,%H%M%S;%n"
CONFIG_SMART_SENSOR_START_CMD_NOTIME="$start:ACQ_CSCS_022H;%n"
CONFIG_SMART_SENSOR_STOP_CMD="$stop;%n"
CONFIG_SMART_SENSOR_START_ACK="$startack;"
CONFIG_SMART_SENSOR_STOP_ACK="$stopack;"
CONFIG_SMART_SENSOR_ACK_TIMEOUT_MS=1000
CONFIG_SMART_SENSOR_DATA_PREFIX="LPM_DATA,"
CONFIG_SMART_SENSOR_DATA_DEPTH_FIELD=1

# ---- When to sample ----
# logdev decides with $UV_PROFILE / $UV_RECORDABOVE; the board follows it.
# A depth window here would further restrict sampling using DEPTH: updates.

# ---- Data sent home ----
# One LPM summary (5 size-class sums) per 10 records, downloaded after the dive.
CONFIG_SMART_PROC_UVP6_LPM=y
CONFIG_SMART_PROC_UVP6_LPM_DECIMATE=10
CONFIG_SMART_STORE_SIZE=32768
