# UVP6 on a Slocum G3 through the Backseat Driver (extctl proglet).
# Reproduces the behaviour of legacy/uvp6_slocum_v1 with the extctl.ini in
# this folder. Edit the values below, rebuild, flash.

CONFIG_SMART_GLIDER_SLOCUM=y
CONFIG_SMART_GLIDER_BAUD=38400
CONFIG_SMART_SENSOR_BAUD=38400

# ---- extctl.ini indices (see extctl.ini next to this file) ----
CONFIG_SMART_SLOCUM_IDX_OUT_HEALTH=0
CONFIG_SMART_SLOCUM_IDX_OUT_TIME_VALID=1
CONFIG_SMART_SLOCUM_IDX_OUT_COUNT=2
CONFIG_SMART_SLOCUM_IDX_OUT_MAX_DEPTH=3
CONFIG_SMART_SLOCUM_IDX_TIME=4
CONFIG_SMART_SLOCUM_IDX_DEPTH=5
CONFIG_SMART_SLOCUM_IDX_PHASE=6

# ---- UVP6 ----
CONFIG_SMART_SENSOR_NAME="UVP6"
CONFIG_SMART_SENSOR_READY_TOKEN="HW_CONF"
CONFIG_SMART_SENSOR_BOOT_TIMEOUT_MS=5000
CONFIG_SMART_SENSOR_START_CMD="$start:ACQ_CSCS_002H,%Y%m%d,%H%M%S;%n"
CONFIG_SMART_SENSOR_START_CMD_NOTIME="$start:ACQ_CSCS_002H;%n"
CONFIG_SMART_SENSOR_STOP_CMD="$stop;%n"
CONFIG_SMART_SENSOR_START_ACK="$startack;"
CONFIG_SMART_SENSOR_STOP_ACK="$stopack;"
CONFIG_SMART_SENSOR_ACK_TIMEOUT_MS=1000
CONFIG_SMART_SENSOR_START_RETRIES=2
CONFIG_SMART_SENSOR_STOP_RETRIES=3
CONFIG_SMART_SENSOR_DATA_PREFIX="LPM_DATA,"
CONFIG_SMART_SENSOR_DATA_DEPTH_FIELD=1

# ---- When to sample ----
# One UVP6 acquisition per dive / climb / hover leg, 2 s apart.
CONFIG_SMART_POLICY_RESTART_ON_PHASE_CHANGE=y
CONFIG_SMART_POLICY_RESTART_HOLDOFF_MS=2000
# Example: only image between 20 m and 500 m
# CONFIG_SMART_POLICY_DEPTH_MIN_M=20
# CONFIG_SMART_POLICY_DEPTH_MAX_M=500
