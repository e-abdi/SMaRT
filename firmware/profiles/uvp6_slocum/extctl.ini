# EXTCTL.INI for SMaRT + UVP6 (profile uvp6_slocum)
# Copy to the science computer config folder.
# The index of each sensor is its position in this file (mp, os, is, from 0)
# and must match the CONFIG_SMART_SLOCUM_IDX_* values in smart.conf.

mp # MISSION PARAMS SECTION

os # OUTPUT SENSORS SECTION (written by SMaRT with $SW)
sci_generic_a nodim  # 0 SMaRT health bits (1 glider link, 2 sensor ready, 4 sampling, 8 time valid, 16 start failed, 32 stop failed, 64 glider msg errors, 128 UART errors)
sci_generic_b nodim  # 1 UVP6 started with glider time: 1 yes, -1 no
sci_generic_c nodim  # 2 LPM_DATA records in the last leg
sci_generic_d m      # 3 deepest LPM_DATA record in the last leg

is # INPUT SENSORS SECTION (sent to SMaRT with $SD)
m_present_time timestamp     # 4
m_depth m                    # 5
cc_final_depth_state_mode enum  # 6 1 diving, 2 climbing, 3 hovering

baud # BAUDRATE CONTROL
38400

packet_size # FILE READ PACKET SIZE CONTROL
500
