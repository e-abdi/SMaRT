# Minimal standalone diagnostic firmware - see tools/assembly_check.py
CONFIG_BOOT_BANNER=n
CONFIG_UART_CONSOLE=n

CONFIG_SERIAL=y
CONFIG_GPIO=y

# Debug output over SEGGER RTT (SWD header J8); never touches the UARTs
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y

CONFIG_MAIN_STACK_SIZE=2048
